services:
  - type: web
    name: mt5-bot-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: ACCOUNT
        sync: false
      - key: PASSWORD
        sync: false
      - key: SERVER
        sync: false
